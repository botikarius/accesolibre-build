name: Compilar Instalador macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 JPype1 pyinstaller

      - name: Descargar librerías Java (Jackcess)
        run: |
          mkdir -p jar
          curl -L -o jar/jackcess-4.0.5.jar https://repo1.maven.org/maven2/com/healthmarketscience/jackcess/jackcess/4.0.5/jackcess-4.0.5.jar
          curl -L -o jar/commons-lang3-3.12.0.jar https://repo1.maven.org/maven2/org/apache/commons/commons-lang3/3.12.0/commons-lang3-3.12.0.jar
          curl -L -o jar/commons-logging-1.2.jar https://repo1.maven.org/maven2/commons-logging/commons-logging/1.2/commons-logging-1.2.jar

      - name: Descargar JRE para macOS
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            URL="https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.9%2B9/OpenJDK17U-jre_x64_mac_hotspot_17.0.9_9.tar.gz"
          else
            URL="https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.9%2B9/OpenJDK17U-jre_aarch64_mac_hotspot_17.0.9_9.tar.gz"
          fi
          curl -L -o jre.tar.gz "$URL"
          mkdir -p jre
          tar -xzf jre.tar.gz -C jre --strip-components=1
          rm jre.tar.gz

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "AccesoLibre" \
            --add-data "jar:jar" \
            --add-data "jre:jre" \
            --hidden-import modo_directo \
            --hidden-import puente_access \
            --hidden-import PySide6.QtSql \
            --hidden-import PySide6.QtPrintSupport \
            --collect-all jpype \
            --osx-bundle-identifier com.accesolibre.app \
            accesolibre.py

      - name: Crear instalador .dmg
        run: |
          mkdir -p dmg_temp
          cp -R "dist/AccesoLibre.app" dmg_temp/
          ln -s /Applications dmg_temp/Aplicaciones
          hdiutil create -volname "AccesoLibre 2007" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "AccesoLibre-2007-macOS-${{ matrix.arch }}.dmg"
          ls -lh *.dmg

      - name: Subir el instalador .dmg
        uses: actions/upload-artifact@v4
        with:
          name: AccesoLibre-macOS-${{ matrix.arch }}
          path: AccesoLibre-2007-macOS-${{ matrix.arch }}.dmg
          retention-days: 7
