name: Compilar Instalador macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 JPype1 pyinstaller

      - name: Descargar librerías Java (Jackcess + Encrypt)
        run: |
          mkdir -p jar
          curl -fsSL -o jar/jackcess-4.0.5.jar "https://repo1.maven.org/maven2/com/healthmarketscience/jackcess/jackcess/4.0.5/jackcess-4.0.5.jar"
          curl -fsSL -o jar/commons-lang3-3.12.0.jar "https://repo1.maven.org/maven2/org/apache/commons/commons-lang3/3.12.0/commons-lang3-3.12.0.jar"
          curl -fsSL -o jar/commons-logging-1.2.jar "https://repo1.maven.org/maven2/commons-logging/commons-logging/1.2/commons-logging-1.2.jar"
          curl -fsSL -o jar/jackcess-encrypt-3.0.0.jar "https://repo1.maven.org/maven2/com/healthmarketscience/jackcess/jackcess-encrypt/3.0.0/jackcess-encrypt-3.0.0.jar"
          curl -fsSL -o jar/bcpkix-jdk15on-1.70.jar "https://repo1.maven.org/maven2/org/bouncycastle/bcpkix-jdk15on/1.70/bcpkix-jdk15on-1.70.jar"
          curl -fsSL -o jar/bcprov-jdk15on-1.70.jar "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk15on/1.70/bcprov-jdk15on-1.70.jar"
          ls -la jar

      - name: Descargar JRE para macOS
        run: |
          mkdir -p jre_temp jre
          curl -fsSL -o jre.tar.gz "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.9%2B9/OpenJDK17U-jre_${{ matrix.arch }}_mac_hotspot_17.0.9_9.tar.gz"
          tar -xzf jre.tar.gz -C jre_temp
          if [ -d jre_temp/*/Contents/Home ]; then
            mv jre_temp/*/Contents/Home/* jre/
          else
            mv jre_temp/*/* jre/
          fi
          rm -rf jre_temp jre.tar.gz
          ls jre

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "AccesoLibre" \
            --add-data "jar:jar" \
            --add-data "jre:jre" \
            --collect-all jpype \
            --hidden-import modo_directo \
            --hidden-import puente_access \
            accesolibre.py

      - name: Crear instalador .dmg
        run: |
          hdiutil create -volname "AccesoLibre" -srcfolder "dist/AccesoLibre" -ov -format UDZO "AccesoLibre-macOS-${{ matrix.arch }}.dmg"

      - name: Subir el instalador .dmg
        uses: actions/upload-artifact@v4
        with:
          name: AccesoLibre-macOS-${{ matrix.arch }}
          path: AccesoLibre-macOS-${{ matrix.arch }}.dmg
          retention-days: 7
